services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transport"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Database=transport;Username=transport;Password=transport
      RawStore__Root: /data/raw
      Inbox__Root: /data/inbox
    volumes:
      - rawdata:/data/raw
      - ./data/inbox:/data/inbox
    depends_on:
      db:
        condition: service_healthy
volumes:
  rawdata:
